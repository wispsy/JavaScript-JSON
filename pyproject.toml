[project]
name = "JavaScript-JSON"
version = "0.1.0"
description = "Parse JSON with JavaScript-style object traversal in Python."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
keywords = ["javascript", "json"]

[project.urls]
Homepage = "https://github.com/wispsy/JavaScript-JSON"
Repository = "https://github.com/wispsy/JavaScript-JSON"
Issues = "https://github.com/wispsy/JavaScript-JSON/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "JSON"
